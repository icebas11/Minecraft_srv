##                          ##
##         BlueMap          ##
##       Core-Config        ##
##                          ##

# accept-download: true indique que tu acceptes l'EULA de Mojang
# (https://account.mojang.com/documents/minecraft_eula), que tu possèdes une licence
# Minecraft Java Edition et que BlueMap peut télécharger le client Minecraft
# depuis les serveurs de Mojang pour en extraire les textures. Sans ça, BlueMap ne fonctionne pas.
accept-download: true

# Dossier de travail de BlueMap (relatif au dossier du serveur)
data: "bluemap"

# Nombre de threads de rendu. Garde une valeur basse pour ne pas pénaliser le jeu.
render-thread-count: 1

update-cooldown: 60
full-update-interval: 1440
region-file-check-interval: 5

# Prend en compte les textures des mods et datapacks
scan-for-mod-resources: true

metrics: false

log: {
  file: "bluemap/logs/debug.log"
  append: false
}
