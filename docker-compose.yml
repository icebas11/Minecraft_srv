name: minecraft

services:
  mc:
    image: itzg/minecraft-server:java21
    container_name: minecraft
    restart: unless-stopped
    tty: true
    stdin_open: true
    stop_grace_period: 1m
    mem_limit: ${MEM_LIMIT:-8g}
    ports:
      - "${MC_PORT:-25565}:25565"     # Jeu (Java)
      # Carte web BlueMap, publiée sur Internet via NPMplus (voir docs/acces-externe.md)
      - "${BLUEMAP_BIND:-0.0.0.0}:${BLUEMAP_PORT:-8100}:8100"
    environment:
      EULA: "TRUE"

      # --- Version : doit rester identique à [versions] dans pack/pack.toml ---
      # (la CI GitHub vérifie la cohérence)
      TYPE: "NEOFORGE"
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.265"

      # --- Mods : le pack packwiz est la seule source de vérité ---
      PACKWIZ_URL: ${PACKWIZ_URL:?PACKWIZ_URL doit être défini dans .env}

      # --- Ressources ---
      MEMORY: ${MEMORY:-6G}
      USE_AIKAR_FLAGS: "true"

      # --- Système ---
      TZ: ${TZ:-Europe/Paris}
      UID: ${PUID:-568}
      GID: ${PGID:-568}
      ENABLE_ROLLING_LOGS: "true"

      # --- Serveur ---
      MOTD: ${MOTD:-Serveur entre amis}
      DIFFICULTY: ${DIFFICULTY:-normal}
      VIEW_DISTANCE: ${VIEW_DISTANCE:-10}
      SIMULATION_DISTANCE: ${SIMULATION_DISTANCE:-8}
      MAX_PLAYERS: ${MAX_PLAYERS:-10}
      ONLINE_MODE: "true"

      # --- Accès ---
      ENABLE_WHITELIST: "true"
      ENFORCE_WHITELIST: "true"
      WHITELIST: ${WHITELIST:-}
      OPS: ${OPS:-}
    volumes:
      - ${MC_DATA_DIR:?MC_DATA_DIR doit être défini dans .env}:/data
